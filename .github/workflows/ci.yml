# Gate commands for every push and pull request, on the three operating
# systems the launcher claims to support. Releases are NOT cut here: they
# are cut locally with `cd server && uv run cz bump` (see CONTRIBUTING.md);
# pushing the tag that writes then runs publish.yml, which uploads to PyPI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ruff + pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Sync the server environment (Python from server/.python-version)
        run: uv sync --directory server
      - name: Lint
        run: uv run --directory server ruff check
      - name: Format check (the sweep landed once; this keeps it from drifting back)
        run: uv run --directory server ruff format --check
      - name: Test
        run: uv run --directory server pytest

  commits:
    name: commit messages (cz check)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --directory server
      - name: Check every commit in the PR against the CONTRIBUTING vocabulary
        run: uv run --directory server cz check --rev-range origin/${{ github.base_ref }}..HEAD

  build:
    name: distribution builds and its metadata passes twine check
    # PyPI file names are burned on upload, so a metadata defect must be
    # caught here, on the PR, not by publish.yml after the tag exists
    # (pypi_publication R01 §D8).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv build server --out-dir dist
      - run: uvx twine check --strict dist/*
